<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BMK Timesheet</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #f7c94f;
      --green: #3dd68c;
      --red: #f75f5f;
      --text: #e8eaf0;
      --muted: #7b80a0;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .brand-logo span { color: var(--accent2); }
    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--mono);
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input[type=text], input[type=password] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-login:hover { opacity: 0.88; }
    .btn-login:active { transform: scale(0.99); }

    .error {
      background: rgba(247,95,95,0.1);
      border: 1px solid rgba(247,95,95,0.35);
      color: var(--red);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      font-size: 0.83rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hint {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.76rem;
      color: var(--muted);
      font-family: var(--mono);
    }
    .hint a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-logo">TIME-TRACK</div>
      <div class="brand-sub">Employee Timesheet System</div>
    </div>

    <div class="card">
      <div class="card-title">Sign in to your account</div>

      {% if error %}
        <div class="error">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" autofocus autocomplete="username" placeholder="Enter your username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
      </form>
    </div>

    <div class="hint">
      Admin access? <a href="/admin/" target="_blank">Django Admin →</a>
    </div>
  </div>
</body>
</html>
